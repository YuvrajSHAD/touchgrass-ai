services:
  - type: web
    name: touchgrass-web
    runtime: node
    rootDir: web
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:change-me@example.com"
      - key: LLM_BASE_URL
        value: "http://touchgrass-llm:8080/v1"
      - key: LLM_MODEL
        value: "gemma-3-1b"
      - key: PORT
        value: "3000"

  - type: pserv
    name: touchgrass-llm
    runtime: docker
    rootDir: llm
    plan: starter
    envVars:
      - key: MODEL_PATH
        value: "/models/model.gguf"
